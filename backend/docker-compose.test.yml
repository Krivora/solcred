# Postgres efímero para las pruebas de integración (`npm run test:int`).
# No persiste datos: `test:db:down` lo borra con su volumen.
services:
  postgres-test:
    image: postgres:16-alpine
    container_name: solcred-postgres-test
    environment:
      POSTGRES_USER: solcred
      POSTGRES_PASSWORD: solcred
      POSTGRES_DB: solcred_test
    ports:
      - "55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solcred -d solcred_test"]
      interval: 2s
      timeout: 3s
      retries: 20
